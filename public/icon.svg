<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4778E8"/>
      <stop offset="100%" stop-color="#315EC9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Calendar frame -->
  <rect x="116" y="136" width="280" height="260" rx="40" stroke="#FFFFFF" stroke-width="26" fill="none"/>
  <!-- Top rings -->
  <line x1="188" y1="100" x2="188" y2="156" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <line x1="324" y1="100" x2="324" y2="156" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <!-- Header bar -->
  <line x1="128" y1="212" x2="384" y2="212" stroke="#FFFFFF" stroke-width="22"/>
  <!-- Clock inside calendar -->
  <circle cx="256" cy="304" r="52" stroke="#FFFFFF" stroke-width="22" fill="none"/>
  <polyline points="256,278 256,304 276,316" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
